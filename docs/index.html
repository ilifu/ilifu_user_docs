<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ilifu User Documentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="keywords" content="ilifu,documentation,HPC,Slurm,cloud computing,astronomy,MeerKAT,bioinformatics,research computing">
  <meta name="description" content="User documentation for the ilifu cloud computing facility: how to request access, log in, transfer data, submit Slurm jobs, and run astronomy and bioinformatics workflows.">

  <!-- Favicon & mobile browser chrome -->
  <link rel="icon" type="image/svg+xml" href="_media/IlifuLogoHiRes.svg">
  <meta name="theme-color" content="#0384bb">

  <!-- Open Graph / Twitter link previews -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ilifu User Documentation">
  <meta property="og:description" content="How to use the ilifu cloud computing facility: access, data transfer, Slurm jobs, and astronomy/bioinformatics workflows.">
  <meta property="og:url" content="https://docs.ilifu.ac.za/">
  <meta property="og:image" content="https://docs.ilifu.ac.za/_media/Ilifu_background.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ilifu User Documentation">
  <meta name="twitter:description" content="How to use the ilifu cloud computing facility: access, data transfer, Slurm jobs, and astronomy/bioinformatics workflows.">
  <meta name="twitter:image" content="https://docs.ilifu.ac.za/_media/Ilifu_background.png">

  <!-- CDN assets carry integrity hashes: when bumping a version, update its hash too or browsers will
       refuse to load the file. Generate one with:
       curl -sL URL | openssl dgst -sha384 -binary | openssl base64 -A -->
  <link rel="stylesheet" href="https://unpkg.com/docsify@5.1.0/dist/themes/core.min.css" integrity="sha384-EHVG4GyaSD3YEuLBkKV9+uYAxVxDbhmNuPVXRdvHjrC0+eLbs8F7fFiR2aeuXY5S" crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/docsify@5.1.0/dist/themes/addons/vue.min.css" integrity="sha384-7UrCrrJrgccq8N0pbtJyi5KxBhdfCP2BMFFGJmHJqlnmKGdPL1W82xz4a2eegGRU" crossorigin="anonymous">
  <style>
    /* Brand the stock Vue theme with the ilifu palette (logo cyan / navy). */
    :root {
      --theme-color: #0384bb;        /* ilifu cyan, darkened for AA contrast on white links */
      --link-color: var(--theme-color);
      --content-max-width: 75%;      /* grow with the window, rather than the add-on's fixed 85ch */
      --codeblock-color: #525252;    /* the Vue add-on's orange inline-code colour would otherwise
                                        apply to all unhighlighted text in code blocks */
    }

    /* Command blocks are prompt-free and meant to be copied. `console` blocks are
       terminal transcripts (prompt + output) shown for illustration, not copying,
       so hide the copy button on them. */
    .markdown-section pre[data-lang="console"] .docsify-copy-code-button {
      display: none;
    }
  </style>
</head>
<body>
  <div id="app">Loading ...</div>
  <script>
    window.$docsify = {
      repo: 'ilifu/ilifu_user_docs',
      coverpage: false,
      auto2top: true,
      maxLevel: 5,
      subMaxLevel: 3,
      loadSidebar: true,
      name: 'Ilifu User Documentation',
      logo: '_media/IlifuLogoHiRes.svg',
      search: {
        placeholder: 'Search the docs…',
        noData: 'No results found.',
        depth: 4
      }
    }
  </script>
  <script src="https://unpkg.com/docsify@5.1.0/dist/docsify.min.js" integrity="sha384-hx+mDRaRp2tw2tlDV9AVMMkU5zRLpaEIGGYt3k1ZiWSxGxIzCyP3FceVHUAMb1bI" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/prismjs@1.30.0/components/prism-json.min.js" integrity="sha384-RhrmFFMb0ZCHImjFMpR/UE3VEtIVTCtNrtKQqXCzqXZNJala02N3UbVhi+qzw3CY" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/prismjs@1.30.0/components/prism-bash.min.js" integrity="sha384-9WmlN8ABpoFSSHvBGGjhvB3E/D8UkNB9HpLJjBQFC2VSQsM1odiQDv4NbEo+7l15" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/prismjs@1.30.0/components/prism-python.min.js" integrity="sha384-WJdEkJKrbsqw0evQ4GB6mlsKe5cGTxBOw4KAEIa52ZLB7DDpliGkwdme/HMa5n1m" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/prismjs@1.30.0/components/prism-yaml.min.js" integrity="sha384-AKAiycghK0jDCjD+aavMHzDkLzRR7Yzcwh3+xL/295cvyVMe+cxQfyQC8xxGGcI8" crossorigin="anonymous"></script>
  <!-- shell-session depends on bash (loaded above); alias `console` to it below. -->
  <script src="https://unpkg.com/prismjs@1.30.0/components/prism-shell-session.min.js" integrity="sha384-raX9ECXyBTKuWD16fdVhIfoW8+QYyLzhUSDstxfaJtZV1Mb5AD793Z3qh0Mj7UPf" crossorigin="anonymous"></script>
  <script>
    if (window.Prism && Prism.languages['shell-session']) {
      Prism.languages.console = Prism.languages['shell-session'];
    }
  </script>
  <script src="https://unpkg.com/docsify@5.1.0/dist/plugins/search.min.js" integrity="sha384-mkjQDRnwrfyRbChj7+qlTfCEvrsSsxs6VVslNDhuufsMKuF4STph3BezVwzTknga" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/docsify@5.1.0/dist/plugins/emoji.min.js" integrity="sha384-QlF05nndaTcxSFl2BsKgJWjKWB8u4+XtP88i+jKH+RPIzgkQF8NO4jMVBZodAML2" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/docsify-pagination@2.10.1/dist/docsify-pagination.min.js" integrity="sha384-uFEp18/1vv2dYlO64J2lOcnbhirAQZPtruqAZZ7PZYoXenm5c+tIs3AqSMjVMRe8" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/docsify-copy-code@3.0.2/dist/docsify-copy-code.min.js" integrity="sha384-xvU4Qmx14Fe/3hDKuOUUQ8eOzoa7OVTL0vp3amTSv2KY8lCjlrga7DoqecFFOT7j" crossorigin="anonymous"></script>
</body>
</html>
